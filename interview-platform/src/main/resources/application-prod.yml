# ==============================================================================
# Production Configuration Profile
# Optimized for containerized deployment, performance, and security
# ==============================================================================

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${DB_DDL_AUTO:update}
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

# Clean production logging (unnecessary SQL logging disabled)
logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
    org.springframework.orm.jpa: WARN
    org.springframework.transaction: WARN
    org.springframework.web: INFO
    com.interviewplatform: INFO

# Production JWT secret strictly from environment variable (no fallback secrets exposed)
jwt:
  secret: ${JWT_SECRET}

# Actuator Health - hide internal system details in production
management:
  endpoint:
    health:
      show-details: never
