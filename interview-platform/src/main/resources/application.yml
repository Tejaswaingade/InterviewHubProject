server:
  port: ${PORT:8080}

spring:
  application:
    name: interview-platform
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL:jdbc:postgresql://ep-shy-cake-b4601kfr-pooler.c-6.us-east-2.aws.neon.tech/neondb?sslmode=require}
    username: ${DB_USERNAME:neondb_owner}
    password: ${DB_PASSWORD:npg_hmXgRs3NAfO5}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:465}
    protocol: smtps
    username: interviewhub21@gmail.com
    password: ${SPRING_MAIL_PASSWORD:krfqqkjtmmmqpkgg}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
            required: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

# Spring Boot Actuator Endpoints Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator

  endpoint:
    health:
      probes:
        enabled: true

# Springdoc OpenAPI / Swagger Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  default-produces-media-type: application/json
  default-consumes-media-type: application/json
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    persist-authorization: true
    try-it-out-enabled: true
    default-models-expand-depth: -1
    default-model-expand-depth: -1
    custom-css: /custom-swagger.css

# JWT Configuration
jwt:
  expiration: ${JWT_EXPIRATION:86400000} # 24 hours in ms

# CORS Configuration
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*,https://*.vercel.app}

# Email Notification Service Configuration (Resend, SendGrid, Brevo, or Gmail SMTP)
mail:
  api-key: ${MAIL_API_KEY:}
  from-email: ${MAIL_FROM:interviewhub21@gmail.com}
  from-name: ${MAIL_FROM_NAME:InterviewHub}

# AI Mock Interview Engine Configuration (OpenAI, Gemini, or Groq)
ai:
  api-key: ${AI_API_KEY:${OPENAI_API_KEY:${GEMINI_API_KEY:}}}
  provider: ${AI_PROVIDER:auto}
