server:
  port: 8080

spring:
  application:
    name: interview-platform
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:465}
    protocol: smtps
    username: ${SPRING_MAIL_USERNAME:${MAIL_USERNAME:waingadetejas@gmail.com}}
    password: ${SPRING_MAIL_PASSWORD:${MAIL_PASSWORD:fuwtqivjxennbnjk}}
    properties:
      mail:
        transport:
          protocol: smtps
        smtp:
          auth: true
          ssl:
            enable: true
            required: true
          socketFactory:
            port: 465
            class: javax.net.ssl.SSLSocketFactory
            fallback: false
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

# Spring Boot Actuator Endpoints Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      probes:
        enabled: true

# Springdoc OpenAPI / Swagger Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  default-produces-media-type: application/json
  default-consumes-media-type: application/json
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    persist-authorization: true
    try-it-out-enabled: true
    default-models-expand-depth: -1
    default-model-expand-depth: -1
    custom-css: /custom-swagger.css

# JWT Configuration
jwt:
  expiration: ${JWT_EXPIRATION:86400000} # 24 hours in ms

# CORS Configuration
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}

# Email Notification Service Configuration (Resend, SendGrid, Brevo, or Gmail SMTP)
mail:
  api-key: ${MAIL_API_KEY:}
  from-email: ${MAIL_FROM:onboarding@resend.dev}
  from-name: ${MAIL_FROM_NAME:InterviewHub}
