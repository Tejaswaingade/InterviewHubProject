version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL 16 Database
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: interviewhub-postgres
    restart: always
    environment:
      POSTGRES_DB: interview_app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-interviewhub_secure_pass_2026}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d interview_app"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # Spring Boot REST API Backend
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./interview-platform
      dockerfile: Dockerfile
    container_name: interviewhub-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: interview_app
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:-interviewhub_secure_pass_2026}
      JWT_SECRET: ${JWT_SECRET:-9vB7kQ2wX4zL8mP1rT5yU3oI6aE0sD9fG2hJ5kL8nQ1wE4rT7yU0iO3pA6sD9fG}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:5173,http://localhost:80}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-interviewhub21@gmail.com}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
    ports:
      - "8080:8080"

  # ----------------------------------------------------------------------------
  # React Vite Frontend (Nginx SPA)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./interview-platform-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: interviewhub-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
    driver: local
